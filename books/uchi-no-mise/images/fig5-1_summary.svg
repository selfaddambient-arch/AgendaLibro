<g text-anchor="middle" font-weight="700">
<text x="260" y="248" font-size="48">お客さんのAI</text>
<text x="1000" y="240" font-size="56">屯</text>
<text x="1740" y="248" font-size="48">他の店</text>
<text x="620" y="226" font-size="38">一つ目の話</text>
<text x="1380" y="226" font-size="38">二つ目の話</text>
<text x="1000" y="620" font-size="46">店の個性に向き合う</text>
