  - {ja: "副店長", to: "adjoint", note: "métaphore du livre 1 : « adjoint de direction » à la première occurrence, puis « adjoint » ; l'IA est un adjoint (nom de rôle, pas de féminin pour une personne)"}
  - {ja: "NanoBanana", to: "Nano Banana", note: "glose à la première mention"}
  - {ja: "おわりに", to: "Postface", note: "titre"}
  - {ja: "はじめに", to: "Introduction", note: "titre"}
