  - {ja: "AgendaHub", to: "AgendaHub", note: "tel quel"}
  - {ja: "AgendaID", to: "AgendaID", note: "tel quel"}
  - {ja: "ProductBootstrap", to: "ProductBootstrap", note: "tel quel"}
