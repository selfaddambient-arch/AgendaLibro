# 用語集（フランス語）。`to:` が訳語。手帳の名前は AgendaHub のフランス語辞書（lib/i18n/dictionaries/fr.ts の hub.product.*.nick）に合わせた。
# 辞書に無い3つ（原価手帳・常連手帳・当番手帳）は窓の案。
terms:
  - {ja: "屯", to: "Tamuro", note: "le bar de l'auteur à Higashi-Nakano, Tokyo. Jamais 'Ton'."}
  - {ja: "T-AI-MURO", to: "T-AI-MURO", note: "tel quel"}
  - {ja: "本多楽", to: "Raku Bonta", note: "prénom d'abord"}
  - {ja: "ボンタ合同会社", to: "Bonta LLC", note: "éditeur"}
  - {ja: "Agendaシリーズ", to: "la série Agenda", note: "noms de produits tels quels : AgendaTimbro, AgendaOro, ..."}
  - {ja: "手帳", to: "carnet", note: "mot générique pour chaque outil de la série. 黒革の手帳 = carnet en cuir noir"}
