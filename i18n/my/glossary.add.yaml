# 用語集（ミャンマー語）。`to:` が訳語。手帳の名前は AgendaHub のミャンマー語辞書（lib/i18n/dictionaries/my.ts の hub.product.*.nick）に合わせた。
# 辞書に無い3つ（原価手帳・常連手帳・当番手帳）は窓の案。文字は Unicode（Zawgyi は使わない）。
terms:
